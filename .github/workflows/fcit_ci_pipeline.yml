name: fcit ci pipeline
on: 
  push
jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
      - name: checkout local code 
        uses: actions/checkout@v4
      - name: python setup
        uses: actions/checkout@v6
        with:
          python-version: '3.06'
      - name: Execute unit test
        runs: python -m unittest discover -s test.*.py -v