name: Session 3

on:
  push:
    branches:
      - main
      - feature/payment

jobs:
  # JOB 1: GitHub Contexts, Variables and Secrets
  session_3_pipeline:
    runs-on: ubuntu-22.04

    steps:
      - name: Display Branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: echo "Branch: $BRANCH_NAME"

      - name: Display Context Values
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          JOB_NAME: ${{ github.job }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Actor: $ACTOR"
          echo "Job: $JOB_NAME"

      - name: Check Main Branch
        if: ${{ github.ref == 'refs/heads/main' }}
        run: echo "Main branch is detected"

      - name: Use Repository Variable
        env:
          DEPLOY_REGION: ${{ vars.DEPLOY_REGION }}
        run: echo "Region: $DEPLOY_REGION"

      - name: Check Secret Safely
        env:
          API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        run: |
          if [ -n "$API_TOKEN" ]; then
            echo "API token is configured"
          else
            echo "API token is not configured"
          fi

  # JOB 2: Create Job Output
  prepare:
    needs: session_3_pipeline
    runs-on: ubuntu-latest

    outputs:
      label: ${{ steps.meta.outputs.label }}

    steps:
      - name: Create Output
        id: meta
        run: echo "label=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  # JOB 3: Access Output from Prepare Job
  build:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Display Build Output
        env:
          BUILD_LABEL: ${{ needs.prepare.outputs.label }}
        run: echo "Build Label: $BUILD_LABEL"

  # JOB 4: Matrix Strategy and Status Check Functions
  test:
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'

    steps:
      - name: Display Context Values
        env:
          RUNNER_OS: ${{ runner.os }}
          BUILD_LABEL: ${{ needs.prepare.outputs.label }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Build label: $BUILD_LABEL"
          echo "Python version: $PYTHON_VERSION"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Normal Validation
        run: echo "Validation completed"

      - name: Success Path
        if: ${{ success() }}
        run: echo "Previous steps succeeded"

      - name: Failure Handler
        if: ${{ failure() }}
        run: echo "A previous step failed"

      - name: Final Summary
        if: ${{ always() }}
        run: echo "Attempt final summary"

      - name: Cancellation Handler
        if: ${{ cancelled() }}
        run: echo "Workflow was cancelled"
