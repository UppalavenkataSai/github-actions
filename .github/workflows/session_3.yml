name: Session 3
on:
  push:
    branches: ['main', 'feature/payment']
jobs: 
  session_3_pipeline:
    runs-on: ubuntu-22.04
    steps:
      - run: echo "Branch ${{ github.ref_name }}"
      - run: |
          echo "Event ${{ github.actor }}"
          echo "user ${{ github.actor }}"
          echo "job ${{ github.job }}"
      - if: ${{ github.ref == 'refs/heads/feature/**' }}
        run: echo " feature branch is Detected "
      - name: use Repository variable
        env:
          DEPLOY_REGION: ${{ vars.DEPLOY_REGION }}
        run: 'echo " Region: $DEPLOY_REGION "' 
      - name: check secret safely
        env:
          API_TOKEN: $ {{ secrets.DEMO_API_TOKEN }}
        run: |
          if [ -n "$API_TOKEN is configured"]: then
            echo "API token is configured"
          else
            echo "API token is not configured"
          fi
