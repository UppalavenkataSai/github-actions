
name: Session 3

on:
  push:
    branches:
      - main
      - feature/payment

jobs:

  # JOB 1: GitHub Contexts, Variables and Secrets
  session_3_pipeline:
    runs-on: ubuntu-22.04

    steps:
      - name: Display Branch
        run: echo "Branch: ${{ github.ref_name }}"

      - name: Display Context Values
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Job: ${{ github.job }}"

      - name: Check Main Branch
        if: ${{ github.ref == 'refs/heads/main' }}
        run: echo "Main branch is detected"

      - name: Use Repository Variable
        env:
          DEPLOY_REGION: ${{ vars.DEPLOY_REGION }}
        run: echo "Region: $DEPLOY_REGION"

      - name: Check Secret Safely
        env:
          API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        run: |
          if [ -n "$API_TOKEN" ]; then
            echo "API token is configured"
          else
            echo "API token is not configured"
          fi

  # JOB 2: Create Job Output
  prepare:
    needs: session_3_pipeline
    runs-on: ubuntu-latest

    outputs:
      labels: ${{ steps.meta.outputs.label }}

    steps:
      - name: Create Output
        id: meta
        run: echo "label=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  # JOB 3: Access Output from Prepare Job
  build:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Display Build Output
        run: echo "Build Label: ${{ needs.prepare.outputs.labels }}"

  # JOB 4: Matrix Strategy and Status Check Functions
  test:
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'

    steps:
      - name: Display Context Values
        run: |
          echo "Runner OS: ${{ runner.os }}"
          echo "Build label: ${{ needs.prepare.outputs.labels }}"
          echo "Python version: ${{ matrix.python-version }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Normal Validation
        run: echo "Validation completed"

      - name: Success Path
        if: ${{ success() }}
        run: echo "Previous steps succeeded"

      - name: Failure Handler
        if: ${{ failure() }}
        run: echo "A previous step failed"

      - name: Final Summary
        if: ${{ always() }}
        run: echo "Attempt final summary"

      - name: Cancellation Handler
        if: ${{ cancelled() }}
        run: echo "Workflow was cancelled"
