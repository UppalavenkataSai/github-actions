name: Task Tracker CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: 
permissions: 
  contents: read
jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up python background
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up pyhton 
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirement.txt
      - name: Install dependencies
        run: pip install -r requirement.txt
      - name: Run Python and create report
        run: python -q --junitxml=test-results.xml
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always( )
        with:
          name: test-report
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 7
          
  package:
    name: create application package
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/cehckout@v4
      - name: create ZIP package
        run: zip -r task-tacker.zip app.py tests requriments.txt
      - name: upload application package
        uses: actions/upload-artifact@v4
        with:
          name: task-tracker-package
          path: task-tracker.zip
          retention-days: 7
  
          
       
