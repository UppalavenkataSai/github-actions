name: Task Tracker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint dependency
        run: python -m pip install ruff
      - name: Run Ruff
        run: ruff check .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install Flask pytest
      - name: Run tests and create report
        run: python -m pytest --junitxml=test-results.xml
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Create application package
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create ZIP package
        run: zip -r task-tracker.zip app.py tests
      - name: Upload application package
        uses: actions/upload-artifact@v4
        with:
          name: task-tracker-package
          path: task-tracker.zip
          retention-days: 7
