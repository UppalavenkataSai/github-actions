name: new_pipeline

on: push

env:
  APP_ENV: staging

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Print environment
        run: echo "Enter your name ${{ env.APP_ENV }}"

  dev:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Print project name
        run: echo "Enter your project name"
