name: new_pipeline

on: push

env:
  APP_ENV: beta staging

jobs:
  test:
    env:
      APP_ENV: dev Staging
    
    runs-on: ubuntu-latest
    steps:
      - name: Print environment
        env:
          APP_ENV: dev Staging
        run: echo "Enter your name ${{ env.APP_ENV }}"

  dev:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Print project name
        run: echo "Enter your project name"
