
name: Free Controlled Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Choose deployment target"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  actions: read

jobs:

  # JOB 1: Validate deployment input
  validate:
    name: Validate Deployment Target
    runs-on: ubuntu-latest

    steps:
      - name: Validate Target
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -e

          if [[ "$TARGET" != "staging" && "$TARGET" != "production" ]]; then
            echo "Invalid deployment target"
            exit 1
          fi

          echo "Selected target: $TARGET"
          echo "Validation successful!"

  # JOB 2: Create one release package
  package:
    name: Build Release Package
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Application Files
        run: |
          set -e

          if [ ! -d "src" ]; then
            echo "src directory not found"
            exit 1
          fi

          if [ ! -f "Dockerfile" ]; then
            echo "Dockerfile not found"
            exit 1
          fi

          echo "Application files verified!"

      - name: Create Release Package
        run: |
          set -e

          mkdir -p release

          tar -czf release/application.tar.gz src Dockerfile

          cd release

          sha256sum application.tar.gz > application.tar.gz.sha256

          echo "Release package created successfully!"
          ls -lh

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  # JOB 3: Deploy to staging
  staging:
    name: Staging Deployment
    needs: package
    runs-on: ubuntu-latest

    if: ${{ inputs.target == 'staging' || inputs.target == 'production' }}

    steps:
      - name: Download Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: release

      - name: Verify Package Checksum
        run: |
          set -e

          cd release

          sha256sum -c application.tar.gz.sha256

          echo "Package integrity verified!"

      - name: Extract Application Package
        run: |
          mkdir -p staging-app

          tar -xzf release/application.tar.gz -C staging-app

          echo "Application package extracted successfully!"

      - name: Simulate Staging Deployment
        run: |
          echo "================================"
          echo "Starting STAGING deployment"
          echo "================================"

          echo "Deploying application package..."
          echo "Application deployed successfully!"
          echo "Staging deployment completed!"

      - name: Staging Smoke Test
        run: |
          echo "Running staging smoke tests..."

          echo "Checking application package..."
          test -d staging-app/src
          test -f staging-app/Dockerfile

          echo "Staging smoke test PASSED!"

  # JOB 4: Deploy to production
  production:
    name: Production Deployment
    needs: staging
    runs-on: ubuntu-latest

    if: ${{ inputs.target == 'production' }}

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Download Same Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: release

      - name: Verify Package Checksum
        run: |
          set -e

          cd release

          sha256sum -c application.tar.gz.sha256

          echo "Production package integrity verified!"

      - name: Extract Application Package
        run: |
          mkdir -p production-app

          tar -xzf release/application.tar.gz -C production-app

          echo "Production package extracted successfully!"

      - name: Simulate Production Deployment
        run: |
          echo "================================"
          echo "Starting PRODUCTION deployment"
          echo "================================"

          echo "Deploying the same release package..."
          echo "Application deployed successfully!"
          echo "Production deployment completed!"

      - name: Production Smoke Test
        run: |
          echo "Running production smoke tests..."

          test -d production-app/src
          test -f production-app/Dockerfile

          echo "Production smoke test PASSED!"

      - name: Release Summary
        if: success()
        run: |
          echo "================================"
          echo "RELEASE COMPLETED SUCCESSFULLY"
          echo "================================"

          echo "Commit: $GITHUB_SHA"
          echo "Target: production"
          echo "Deployment status: SUCCESS"

  # JOB 5: Final staging summary
  staging-summary:
    name: Staging Release Summary
    needs: staging
    runs-on: ubuntu-latest

    if: ${{ inputs.target == 'staging' && needs.staging.result == 'success' }}

    steps:
      - name: Release Summary
        run: |
          echo "================================"
          echo "STAGING RELEASE COMPLETED"
          echo "================================"

          echo "Commit: $GITHUB_SHA"
          echo "Target: staging"
          echo "Deployment status: SUCCESS"
