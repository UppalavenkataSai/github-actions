name: Free Controlled Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Choose where to promote the tested package"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate target on the runner
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" != "staging" ] && [ "$TARGET" != "production" ]; then
            echo "Unsupported target"
            exit 1
          fi
          echo "Valid target: $TARGET"

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create one release package
        run: |
          mkdir -p release
          tar -czf release/application.tar.gz src Dockerfile
          sha256sum release/application.tar.gz > release/application.tar.gz.sha256
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  staging:
    needs: package
    if: ${{ inputs.target == 'staging' || inputs.target == 'production' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: release
      - name: Verify package checksum
        run: cd release && sha256sum -c application.tar.gz.sha256
      - name: Show whether staging settings exist (values are never printed)
        env:
          REGION: ${{ vars.DEPLOY_REGION }}
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          [ -n "$REGION" ] && echo "DEPLOY_REGION is configured" || echo "DEPLOY_REGION is not configured"
          [ -n "$TOKEN" ] && echo "DEPLOY_TOKEN is configured" || echo "DEPLOY_TOKEN is not configured"
      - name: Staging deployment placeholder
        run: echo "Demo only: deploy this exact package to STAGING here."
      - name: Staging smoke-test placeholder
        run: echo "Demo only: run your staging health endpoint check here."

  production:
    needs: staging
    if: ${{ inputs.target == 'production' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: release
      - name: Verify the same package checksum
        run: cd release && sha256sum -c application.tar.gz.sha256
      - name: Show whether production settings exist (values are never printed)
        env:
          REGION: ${{ vars.DEPLOY_REGION }}
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          [ -n "$REGION" ] && echo "DEPLOY_REGION is configured" || echo "DEPLOY_REGION is not configured"
          [ -n "$TOKEN" ] && echo "DEPLOY_TOKEN is configured" || echo "DEPLOY_TOKEN is not configured"
      - name: Production deployment placeholder
        run: echo "Demo only: deploy the same package to PRODUCTION here."
      - name: Production smoke-test placeholder
        run: echo "Demo only: run production health check here."
      - name: Rollback guidance
        if: failure()
        run: echo "Deployment failed: follow your rollback runbook and redeploy the previous known-good artifact."
