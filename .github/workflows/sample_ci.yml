name: sample CI
on:
  push:
    branches: feature/payment
permissions: 
  contents: read
env:
  APP_NAME: demo-app

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Checking $APP_NAME"
      - name: List app files
        working-directory: ...
        timeout-minutes: 2
        run: ls -la
      - name: Show diagnostic
        if: failure()
        run: echo "A previous step failed"
  Success:
    needs: checks
    runs-on: windows-latest
    steps:
      - run: echo "This is pipeline is sucess"

