name: sample CI
on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "Choose a demo target"
        required: true
        type: choice
        options:
        - staging
        - production
permissions: 
  contents: read

env:
  APP_NAME: demo-app

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Checking $APP_NAME"
      - name: Set variable
        run: echo "APP_ENV=testing" >> "$GITHUB_ENV"
      - name: Use variable
        run: echo "$APP_ENV"
  Success:
    needs: checks
    runs-on: windows-latest
    steps:
      - run: echo "This is pipeline is sucess"

