name: sample CI
on:
  push:
    branches: main
permissions: 
  contents: read

env:
  APP_NAME: demo-app

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Checking $APP_NAME"
      - name: List app files
        working-directory: ./app
        timeout-minutes: 2
        run: ls -la
  Success:
    runs-on: windows-latest
    steps:
      - run: echo "This is pipeline is sucess"

