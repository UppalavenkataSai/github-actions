name: MY PIPELINE
on: push
jobs:
  testcase:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository background
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13' 
      - run: python test_*.py
