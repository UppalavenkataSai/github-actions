name: CI Pipeline
on:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python Tests
        run: |
          python --version
          pip --version
          python -m unittest discover -s . -p "test_*.py" -v
