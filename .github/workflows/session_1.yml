name: ci pipeline
on: 
  push:
jobs:
  test:
    runs-on: ubuntu-latest 
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: set up python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v

      
